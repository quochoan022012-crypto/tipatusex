name: Build TIPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        run: |
          set -e
          export THEOS="$GITHUB_WORKSPACE/theos"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Download libAPIClient.a from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          mkdir -p TipaTipaKtien/API
          gh release download v1.0             --repo "$GITHUB_REPOSITORY"             --pattern "libAPIClient.a"             --dir TipaTipaKtien/API             --clobber
          test -s TipaTipaKtien/API/libAPIClient.a
          ls -lh TipaTipaKtien/API/libAPIClient.a

      - name: Build TIPA
        shell: bash
        run: |
          set -e
          export THEOS="$GITHUB_WORKSPACE/theos"
          cd TipaTipaKtien
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: QHOANIOS-TIPA
          path: TipaTipaKtien/packages/*.tipa
          if-no-files-found: error
