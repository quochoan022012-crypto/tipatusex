name: Build TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        run: |
          set -eux

          export THEOS="$GITHUB_WORKSPACE/theos"

          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

          test -d "$THEOS"
          echo "Theos installed successfully"

      - name: Check project
        shell: bash
        run: |
          set -eux

          echo "===== ROOT ====="
          ls -la

          echo "===== FILES ====="
          find . -maxdepth 3 -type f | sort

          test -f Makefile || test -f makefile

          echo "Makefile found"

      - name: Check APIClient.h
        shell: bash
        run: |
          set -eux

          echo "===== SEARCH APIClient.h ====="

          API_HEADER="$(find . -type f -name 'APIClient.h' | head -n 1)"

          if [ -z "$API_HEADER" ]; then
            echo "ERROR: APIClient.h not found"
            exit 1
          fi

          echo "Found: $API_HEADER"

          ls -lh "$API_HEADER"

      - name: Build TIPA
        shell: bash
        run: |
          set -eux

          export THEOS="$GITHUB_WORKSPACE/theos"

          make clean || true
          make package FINALPACKAGE=1

      - name: Show build output
        shell: bash
        run: |
          set -eux

          echo "===== BUILD OUTPUT ====="

          find . -type f \
            \( -name "*.tipa" -o -name "*.deb" \) \
            -print

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: QHOANIOS-TIPA
          path: |
            packages/*.tipa
            .theos/packages/*.tipa
          if-no-files-found: error
