name: Build TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        run: |
          set -eux
          export THEOS="$GITHUB_WORKSPACE/theos"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Check project
        shell: bash
        run: |
          set -eux
          echo "===== ROOT ====="
          ls -la
          test -f makefile
          echo "Makefile found"

      - name: Download libAPIClient.a
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eux
          mkdir -p API

          gh release download v1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "libAPIClient.a" \
            --dir API \
            --clobber

          test -s API/libAPIClient.a
          ls -lh API/libAPIClient.a

      - name: Build TIPA
        shell: bash
        run: |
          set -eux
          export THEOS="$GITHUB_WORKSPACE/theos"

          make clean || true
          make package FINALPACKAGE=1

      - name: Show build output
        shell: bash
        run: |
          set -eux
          echo "===== BUILD OUTPUT ====="
          find . -type f \( -name "*.tipa" -o -name "*.deb" \) -print

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: QHOANIOS-TIPA
          path: packages/*.tipa
          if-no-files-found: error
